spring:
  application:
    name: ride-service

  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://cockroachdb:26257/ride_db?sslmode=disable}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

    pool:
      enabled: true
      initial-size: 10
      max-size: 50
      max-idle-time: 30m

  flyway:
    enabled: true
    url: ${FLYWAY_URL:jdbc:postgresql://cockroachdb:26257/ride_db?sslmode=disable}
    user: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    locations: classpath:db/migration

server:
  port: 8083

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-service:8761/eureka/