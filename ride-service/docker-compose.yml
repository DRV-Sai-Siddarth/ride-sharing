version: '3.9'

services:
  cockroachdb:
    image: cockroachdb/cockroach:v25.2.1
    container_name: cockroachdb
    restart: unless-stopped

    command: start-single-node --insecure

    ports:
      - "26257:26257"   # SQL Port
      - "8080:8080"     # Admin UI

    volumes:
      - cockroach-data:/cockroach/cockroach-data

volumes:
  cockroach-data: