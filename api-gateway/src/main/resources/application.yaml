spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: ride-service
              uri: lb://RIDE-SERVICE
              predicates:
                - Path=/api/v1/rides/**
            - id: driver-location-service
              uri: lb://DRIVER-LOCATION-SERVICE
              predicates:
                - Path=/api/v1/locations/**

server:
  port: 4040

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway: TRACE