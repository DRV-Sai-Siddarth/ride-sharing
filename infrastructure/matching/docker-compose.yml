version: "3.9"

services:

  matching-service:

    image: rdutta2/matching-service:v1

    container_name: matching-service

    ports:
      - "8082:8082"

    environment:

      KAFKA_BOOTSTRAP_SERVERS: kafka:9093

      EUREKA_URL: http://discovery-service:8761/eureka/

    networks:
      - ride-network

networks:
  ride-network:
    external: true