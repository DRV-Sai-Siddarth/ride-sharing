services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      # Mount your file over the main nginx.conf file
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - ride-network

  api-gateway:
    image: rdutta2/api-gateway:v1 # Replace with your actual image or build context
    networks:
      - ride-network

networks:
  ride-network:
    external: true