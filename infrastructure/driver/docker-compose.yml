version: "3.9"

services:

  driver-location-service:

    image: rdutta2/driver-location-service:v1

    container_name: driver-location-service

    ports:
      - "8083:8083"

    environment:

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9093

      EUREKA_URL: http://discovery-service:8761/eureka/

    networks:
      - ride-network

networks:
  ride-network:
    external: true